# ═══════════════════════════════════════════════════════════════════════════════
# device.conf — Device & KMI ABI configuration for Xiaomi POCO M7 (creek)
# SoC: Qualcomm SM6225 "khaje" (Snapdragon 685) — DT model "KHAJE IDP nopmi creek"
# Stock firmware baseline: OS3.0.305.0.WBOMIXM (HyperOS 3, Android 16, global)
# ═══════════════════════════════════════════════════════════════════════════════
# Every key uses `: "${VAR:=default}"` so caller environment variables win.

# ── Identity & Branding ──────────────────────────────────────────────────────
: "${DEVICE_LABEL:=Poco M7}"
: "${DEVICE_FULL_LABEL:=Xiaomi POCO M7 (creek)}"
: "${DEVICE_SOC:=Qualcomm Snapdragon 685 (SM6225 khaje)}"
: "${DEVICE_CODENAME:=creek}"
: "${DEVICE_NAMES:=creek creek_global}"
# AnyKernel3 device check OFF (operator, 2026-11-16): a tester's Redmi 15 4G — the same
# "KHAJE IDP nopmi creek" board DT and module set — was refused by do.devicecheck=1
# ("Unsupported device, error 1"); with it off, the zip installed and the kernel booted.
# The installer's 5.15 GKI guard still refuses any non-5.15 kernel. 1 = check DEVICE_NAMES.
: "${DEVICE_CHECK:=0}"
: "${BRAND:=Riza}"
: "${BRAND_FULL:=Riza Kernel}"
: "${KBUILD_BUILD_USER:=riza}"
: "${KBUILD_BUILD_HOST:=${BRAND}Kernel}"

# ── Boot Image Packaging ─────────────────────────────────────────────────────
# Stock boot.img: header v4, PAGESIZE 4096, RAMDISK_SZ 0 (init_boot holds the
# ramdisk), KERNEL_FMT raw (an uncompressed 47,577,600 B Image), 96 MiB partition.
: "${KERNEL_FMT:=raw}"

# ── Toolchain ────────────────────────────────────────────────────────────────
# Neutron clang 24.0.0git (06092026, llvm f42c87ba). Home box and server paths.
if [[ -z "${CLANG_DIR:-}" ]]; then
  for _d in "$HOME/rs4-kernel/toolchain/neutron-clang-06092026" \
            /home/riza/itel-rs4-kernel/toolchain/neutron-clang-06092026; do
    [[ -x "$_d/bin/clang" ]] && { CLANG_DIR="$_d"; break; }
  done
fi
: "${CLANG_DIR:=}"

# ── KMI ABI Target (android13-5.15, KMI generation 8) ────────────────────────
# Agreed by all 562 vendor modules (295 vendor_boot + 267 vendor_dlkm), both
# system_dlkm modules (zram, zsmalloc) and stock boot.img's vmlinux (8,575 exports).
: "${MODULE_LAYOUT:=0x0222dd63}"

# Reference trees harvested by tools/extract-device-material.sh
: "${KMI_REF_TREE:=${PROJ:-$(pwd)}/.build/kmi-ref}"
: "${KMI_REF_SYSTEM_TREE:=${PROJ:-$(pwd)}/.build/kmi-ref-system}"
: "${STOCK_SYMVERS:=${PROJ:-$(pwd)}/.build/stock/stock.symvers}"
# Gate Layer 6 reference: the pristine tree built with the stock compiler (clang-r450784e)
: "${CFI_REF_VMLINUX:=${PROJ:-$(pwd)}/.build/cfi-ref/vmlinux}"

# Provenance vermagics asserted by Gate Layer 1. Under MODVERSIONS the kernel's
# same_magic() compares only the flag tail, so these are a provenance check
# (right reference set), not a load condition. The vendor set is mixed:
# 555 modules say 5.15.167, 7 say 5.15.153.
: "${KMI_EXPECT_VERMAGIC:=5.15.167 SMP preempt mod_unload modversions aarch64}"
: "${KMI_SYSTEM_EXPECT_VERMAGIC:=5.15.194 SMP preempt mod_unload modversions aarch64}"
export KMI_EXPECT_VERMAGIC KMI_SYSTEM_EXPECT_VERMAGIC

# Zero waivers: every vendor and system_dlkm module must pass 100 %
: "${KMI_VENDOR_KNOWN_BAD:=}"
: "${KMI_SYSTEM_KNOWN_BAD:=}"
: "${KMI_UNRESOLVED_EXPECTED:=}"
export KMI_VENDOR_KNOWN_BAD KMI_SYSTEM_KNOWN_BAD KMI_UNRESOLVED_EXPECTED

# ── Stock Inputs ─────────────────────────────────────────────────────────────
: "${STOCK_BOOT_IMG:=${PROJ:-$(pwd)}/boot.img}"
: "${STOCK_VENDOR_BOOT_IMG:=${PROJ:-$(pwd)}/vendor_boot.img}"
: "${STOCK_VENDOR_DLKM_IMG:=${PROJ:-$(pwd)}/vendor_dlkm.img}"
: "${STOCK_SYSTEM_DLKM_IMG:=${PROJ:-$(pwd)}/system_dlkm.img}"
: "${STOCK_CONFIG:=${PROJ:-$(pwd)}/.build/ikconfig/stock.config}"
: "${KERNEL_SRC:=${PROJ:-$(pwd)}/.build/kernel-src}"
